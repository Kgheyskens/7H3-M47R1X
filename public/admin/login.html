<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament dashboard · Sign in</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 30% 20%, #1e2a4a, #0b0f1a 60%);
    color: #e6e9f0;
  }
  form {
    width: min(360px, 92vw); padding: 32px; border-radius: 16px;
    background: #141a29; border: 1px solid #232c44;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p { margin: 0 0 24px; color: #8b95ad; font-size: 14px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8b95ad; margin-bottom: 8px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px; font-size: 15px;
    background: #0d1220; border: 1px solid #2a3450; color: inherit;
  }
  input:focus { outline: 2px solid #5865f2; outline-offset: 1px; }
  button {
    width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px;
    background: #5865f2; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #4752c4; }
  button:disabled { opacity: .6; cursor: default; }
  .error { margin-top: 14px; font-size: 14px; color: #ff6b6b; min-height: 20px; }
</style>
</head>
<body>
<form id="form">
  <h1>Tournament dashboard</h1>
  <p>Enter the administrator code to review match submissions.</p>
  <label for="token">Administrator code</label>
  <input id="token" type="password" autocomplete="current-password" required>
  <button id="submit" type="submit">Sign in</button>
  <div class="error" id="error"></div>
</form>
<script>
  const form = document.getElementById('form');
  const errorBox = document.getElementById('error');
  const button = document.getElementById('submit');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.textContent = '';
    button.disabled = true;

    try {
      const response = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: document.getElementById('token').value }),
      });
      const data = await response.json().catch(() => ({}));

      if (response.ok) {
        window.location.href = '/admin';
        return;
      }
      errorBox.textContent = data.error || 'Sign in failed.';
    } catch {
      errorBox.textContent = 'Could not reach the server.';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
