<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament dashboard</title>
<link rel="stylesheet" href="/admin/app.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    <strong>Tournament dashboard</strong>
  </div>
  <div class="controls">
    <select id="guild" aria-label="Server"></select>
    <button id="refresh" type="button" class="ghost">Refresh</button>
    <a class="ghost" href="/admin/logout">Sign out</a>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button type="button" data-tab="pending" class="active">Pending<span class="count" id="count-pending"></span></button>
  <button type="button" data-tab="ai_corrected">AI corrected<span class="count" id="count-ai_corrected"></span></button>
  <button type="button" data-tab="approved">Approved</button>
  <button type="button" data-tab="rejected">Rejected</button>
  <button type="button" data-tab="all">All</button>
</nav>

<section class="summary">
  <div class="stat"><span class="label">Showing</span><strong id="stat-visible">0</strong></div>
  <div class="stat"><span class="label">AI accuracy</span><strong id="stat-accuracy">n/a</strong></div>
  <div class="stat wide"><span class="label">Status</span><strong id="stat-status">Loading…</strong></div>
</section>

<main id="grid" class="grid"></main>

<template id="card">
  <article class="card">
    <div class="card-head">
      <div>
        <h2 class="player"></h2>
        <p class="meta"></p>
      </div>
      <span class="badge"></span>
    </div>

    <div class="shot"><img alt="Match screenshot" loading="lazy"></div>

    <div class="ai">
      <div class="ai-head"><span class="ai-badge"></span><span class="ai-confidence"></span></div>
      <p class="ai-note"></p>
      <p class="warning" hidden></p>
    </div>

    <dl class="facts">
      <div><dt>Submitted kills</dt><dd class="fact-kills"></dd></div>
      <div><dt>Win claimed</dt><dd class="fact-win"></dd></div>
      <div><dt>AI read kills</dt><dd class="fact-ai-kills"></dd></div>
      <div><dt>Epic name</dt><dd class="fact-epic"></dd></div>
    </dl>

    <form class="decision">
      <div class="row">
        <label>Kills<input type="number" min="0" max="100" class="input-kills" required></label>
        <label class="check"><input type="checkbox" class="input-win"> Victory Royale</label>
      </div>
      <input type="text" class="input-note" maxlength="500" placeholder="Optional note">
      <div class="row actions">
        <button type="button" class="danger btn-reject">Reject</button>
        <button type="submit" class="primary btn-approve">Approve</button>
      </div>
    </form>
  </article>
</template>

<script src="/admin/app.js"></script>
</body>
</html>
